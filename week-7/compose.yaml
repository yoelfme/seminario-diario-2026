services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: seminario
      POSTGRES_PASSWORD: seminario
      POSTGRES_DB: seminario
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seminario -d seminario"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
